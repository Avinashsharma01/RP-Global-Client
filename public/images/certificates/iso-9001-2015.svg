<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="navyArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2d38" />
      <stop offset="100%" stop-color="#071b22" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Parchment White Background -->
  <rect x="0" y="0" width="600" height="850" fill="#ffffff" />
  
  <!-- Outer Gold Border -->
  <rect x="18" y="18" width="564" height="814" fill="none" stroke="url(#goldBorder)" stroke-width="6" rx="4" />
  <rect x="26" y="26" width="548" height="798" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 3" />
  <rect x="32" y="32" width="536" height="786" fill="none" stroke="#0f2d38" stroke-width="1.5" />

  <!-- Left Golden Waves & Right Navy Arch Decor -->
  <path d="M 32 32 Q 180 80 120 280 T 32 400 Z" fill="#fef3c7" opacity="0.6" />
  <path d="M 568 32 C 530 180 540 380 568 550 L 568 32 Z" fill="#0f2d38" opacity="0.9" />

  <!-- Header: Certificate of Registration -->
  <text x="300" y="95" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" font-weight="bold" fill="#b45309" text-anchor="middle">
    Certificate of Registration
  </text>
  <text x="300" y="125" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#526a72" text-anchor="middle">
    This is to Certify that the Quality Management System of
  </text>

  <!-- Organization Box -->
  <rect x="70" y="150" width="460" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="300" y="185" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#0f2d38" letter-spacing="1.5" text-anchor="middle">
    R P GLOBAL PROJECTS
  </text>
  <text x="300" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    NOIDA / DELHI NCR • INDIA • WATER &amp; WASTEWATER EPC
  </text>

  <!-- Certification Standard Badge -->
  <text x="300" y="255" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    has been assessed and found to conform to the requirements of:
  </text>
  <text x="300" y="300" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900" fill="#0077b6" letter-spacing="2" text-anchor="middle">
    ISO 9001:2015
  </text>
  <rect x="210" y="315" width="180" height="4" rx="2" fill="url(#goldBorder)" />

  <!-- Scope Description -->
  <text x="300" y="340" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0f2d38" text-anchor="middle" letter-spacing="0.5">
    FOR THE FOLLOWING SCOPE:
  </text>
  <rect x="60" y="355" width="480" height="135" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="300" y="380" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">
    MANUFACTURE &amp; SUPPLIER OF WATER AND WASTE WATER TREATMENT
  </text>
  <text x="300" y="402" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">
    PLANTS LIKE STP, ETP, WTP, DOMESTIC &amp; INDUSTRIAL RO PLANTS,
  </text>
  <text x="300" y="424" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">
    WATER SOFTENER, DM PLANTS, ZLD SYSTEMS AND RELATED
  </text>
  <text x="300" y="446" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">
    TURNKEY PIPING &amp; MECHANICAL CIVIL WORKS.
  </text>

  <!-- Technical Audit Data Grid -->
  <g font-family="'Inter', sans-serif" font-size="10" fill="#334155" transform="translate(65, 515)">
    <rect x="0" y="0" width="470" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="235" y1="0" x2="235" y2="95" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="15" y="25" font-weight="600">Certificate No:</text>
    <text x="130" y="25" font-weight="700" font-family="monospace" fill="#0077b6">20EQCK10</text>
    
    <text x="15" y="50" font-weight="600">Initial Registration Date:</text>
    <text x="145" y="50">05/08/2023</text>
    
    <text x="15" y="75" font-weight="600">Surveillance Date:</text>
    <text x="145" y="75">04/08/2026</text>

    <text x="250" y="25" font-weight="600">Issuing Body:</text>
    <text x="340" y="25" font-weight="700">MMS Services</text>

    <text x="250" y="50" font-weight="600">Accreditation:</text>
    <text x="340" y="50" font-weight="700" fill="#16a34a">IAF / EGAC</text>

    <text x="250" y="75" font-weight="600">Status:</text>
    <text x="340" y="75" font-weight="800" fill="#16a34a">VERIFIED ACTIVE</text>
  </g>

  <!-- Accreditation Seals & Signatures -->
  <g transform="translate(60, 650)">
    <!-- IAF Seal Simulation -->
    <circle cx="50" cy="50" r="32" fill="#0284c7" opacity="0.1" stroke="#0284c7" stroke-width="2" />
    <text x="50" y="47" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">IAF</text>
    <text x="50" y="62" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#0284c7" text-anchor="middle">ACCREDITED</text>

    <!-- EGAC Emblem Simulation -->
    <circle cx="150" cy="50" r="32" fill="#d97706" opacity="0.1" stroke="#d97706" stroke-width="2" />
    <text x="150" y="47" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#d97706" text-anchor="middle">EGAC</text>
    <text x="150" y="62" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#d97706" text-anchor="middle">ISO/IEC 17021</text>

    <!-- Director Signature Box -->
    <g transform="translate(320, 10)">
      <path d="M 10 40 Q 30 15 50 35 T 90 20 T 130 38" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="50" x2="150" y2="50" stroke="#94a3b8" stroke-width="1" />
      <text x="75" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f2d38" text-anchor="middle">Managing Director</text>
      <text x="75" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Magnitude Management Services</text>
    </g>
  </g>

  <!-- Bottom Footer Note -->
  <text x="300" y="810" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">
    Official ISO Registration Record • Magnitude Management Services Pvt. Ltd. • www.mmsintl.com
  </text>
</svg>
