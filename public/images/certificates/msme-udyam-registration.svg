<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <!-- Clean Legal White Background -->
  <rect x="0" y="0" width="600" height="850" fill="#ffffff" />

  <!-- Outer Double Slate Frame -->
  <rect x="20" y="20" width="560" height="810" fill="none" stroke="#ea580c" stroke-width="2" />
  <rect x="26" y="26" width="548" height="798" fill="none" stroke="#fed7aa" stroke-width="1" />

  <!-- Ashoka Lion Emblem / MSME Logo -->
  <g transform="translate(270, 48)">
    <circle cx="30" cy="30" r="28" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <path d="M30 14 L38 28 L22 28 Z" fill="#ea580c" />
    <circle cx="30" cy="36" r="6" fill="#ea580c" />
  </g>

  <!-- Header Titles -->
  <g font-family="'Inter', sans-serif" text-anchor="middle">
    <text x="300" y="128" font-size="11" font-weight="900" fill="#9a3412" letter-spacing="1">GOVERNMENT OF INDIA</text>
    <text x="300" y="144" font-size="9" font-weight="700" fill="#c2410c">MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES</text>
    <text x="300" y="158" font-size="8" fill="#64748b">Udyam Registration Portal: www.udyamregistration.gov.in</text>
  </g>

  <line x1="45" y1="170" x2="555" y2="170" stroke="#fdba74" stroke-width="1.5" />

  <!-- Title Banner -->
  <rect x="100" y="185" width="400" height="32" rx="4" fill="#7c2d12" />
  <text x="300" y="206" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    UDYAM REGISTRATION CERTIFICATE
  </text>

  <!-- Number Box -->
  <rect x="80" y="235" width="440" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="300" y="254" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#c2410c" text-anchor="middle">
    UDYAM REGISTRATION NUMBER
  </text>
  <text x="300" y="275" font-family="monospace" font-size="15" font-weight="900" fill="#431407" text-anchor="middle" letter-spacing="2">
    UDYAM-HR-04-0048291
  </text>

  <!-- Enterprise Data Table -->
  <g transform="translate(45, 310)" font-family="'Inter', sans-serif" font-size="9" fill="#334155">
    <rect x="0" y="0" width="510" height="230" rx="4" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1" />

    <text x="18" y="28" font-weight="700" fill="#1c1917">1. Name of Enterprise:</text>
    <text x="185" y="28" font-weight="800" fill="#0f172a">M/S R P GLOBAL PROJECTS</text>

    <text x="18" y="58" font-weight="700" fill="#1c1917">2. Major Activity:</text>
    <text x="185" y="58" font-weight="700" fill="#ea580c">MANUFACTURING &amp; SERVICES (WATER EPC)</text>

    <text x="18" y="88" font-weight="700" fill="#1c1917">3. Type of Enterprise:</text>
    <text x="185" y="88">Small Enterprise (Industrial Equipment)</text>

    <text x="18" y="118" font-weight="700" fill="#1c1917">4. Date of Incorporation:</text>
    <text x="185" y="118">20/02/2019</text>

    <text x="18" y="148" font-weight="700" fill="#1c1917">5. National Industry Classification (NIC):</text>
    <text x="185" y="148">28195 — Manufacture of filtering or purifying machinery for water</text>
    <text x="185" y="166">42204 — Construction of utility projects for water treatment and supply</text>

    <text x="18" y="196" font-weight="700" fill="#1c1917">6. Official Registered Office:</text>
    <text x="185" y="196">DELHI NCR / GURGAON / HARYANA — 134107, INDIA</text>
  </g>

  <!-- Security & Verification Box with QR Code Simulation -->
  <g transform="translate(45, 560)">
    <rect x="0" y="0" width="510" height="90" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    
    <!-- QR Code Graphic -->
    <rect x="15" y="12" width="66" height="66" fill="#ffffff" stroke="#d97706" stroke-width="1" />
    <rect x="22" y="19" width="16" height="16" fill="#78350f" />
    <rect x="58" y="19" width="16" height="16" fill="#78350f" />
    <rect x="22" y="55" width="16" height="16" fill="#78350f" />
    <rect x="44" y="38" width="12" height="12" fill="#78350f" />

    <text x="100" y="32" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#78350f">
      DIGITALLY VERIFIED UDYAM CERTIFICATE
    </text>
    <text x="100" y="48" font-family="'Inter', sans-serif" font-size="8.5" fill="#92400e">
      This is a digitally generated certificate based on self-declaration and authenticated with PAN &amp; GSTIN.
    </text>
    <text x="100" y="64" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#047857">
      Status: Verified Active • Valid for Public Procurement Policy Preference
    </text>
  </g>

  <!-- Stamp and Authority -->
  <g transform="translate(360, 675)">
    <circle cx="45" cy="40" r="30" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="45" y="38" font-family="'Inter', sans-serif" font-size="6.5" font-weight="800" fill="#ea580c" text-anchor="middle">UDYAM DESK</text>
    <text x="45" y="48" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#ea580c" text-anchor="middle">MINISTRY OF MSME</text>

    <text x="110" y="40" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#1c1917">Joint Director</text>
    <text x="110" y="53" font-family="'Inter', sans-serif" font-size="7.5" fill="#57534e">MSME Development Office</text>
  </g>

  <!-- Footer Legal Text -->
  <text x="300" y="805" font-family="'Inter', sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">
    Official Udyam Registration Certificate • Ministry of Micro, Small and Medium Enterprises • Govt. of India
  </text>
</svg>
